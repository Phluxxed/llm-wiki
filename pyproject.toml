[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "anyio>=4",
    "markdown>=3.6",
    "mcp>=2,<3",
    "pyyaml>=6.0",
    'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
llm-wiki = "llm_wiki_core.cli:main"
llm-wiki-mcp = "llm_wiki_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki_core", "src/llm_wiki_mcp"]
