[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "markdown>=3.6",
    "mcp>=1.27,<2",
    "pyyaml>=6.0",
]

[project.scripts]
llm-wiki-mcp = "llm_wiki_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki_mcp"]
